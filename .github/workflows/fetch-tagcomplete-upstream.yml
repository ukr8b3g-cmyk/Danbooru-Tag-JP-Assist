name: Fetch TagComplete sources

on:
  push:
    branches:
      - build/tagcomplete-upstream-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Neo upstream
        run: git clone --depth 1 https://github.com/eduardoabreu81/sd-webui-tagcomplete-neo.git neo

      - name: Clone original upstream
        run: git clone --depth 1 https://github.com/DominikDoom/a1111-sd-webui-tagcomplete.git original

      - name: Prepare archive
        run: |
          rm -rf neo/.git original/.git
          zip -r tagcomplete-sources.zip neo original

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tagcomplete-sources
          path: tagcomplete-sources.zip
          if-no-files-found: error
          retention-days: 1
