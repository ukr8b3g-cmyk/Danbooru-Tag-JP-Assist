name: Product regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install ComfyUI-provided test dependency
        run: python -m pip install --disable-pip-version-check aiohttp==3.14.5
      - name: Test CSV parsing and search
        run: python -B tests/test_backend.py
      - name: Test completion and input lifecycle
        run: node --test tests/test_completion_core.mjs tests/test_autocomplete.mjs tests/test_prompt_format.mjs tests/test_tooltip_cleanup.mjs tests/test_usage_history.mjs
