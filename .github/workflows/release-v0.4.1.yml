name: Publish Danbooru Tag JP Assist v0.4.1 (one-time)
# The publisher runs ONLY for the exact v0.4.1 release commit on main.
# It waits for both existing required source CI workflows and dispatches the
# existing guarded Registry publisher; it does not republish a reserved version.
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
concurrency:
  group: danbooru-jp-assist-v0.4.1-publication
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ukr8b3g-cmyk/Danbooru-Tag-JP-Assist' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release v0.4.1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.4.1
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Python 3.12 for release metadata validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact source and both required source CI results before tagging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]

          def gh_json(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/{endpoint}"], text=True))

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          require(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == sha,
                  "Checked-out source SHA mismatch")
          require(subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip() == "Release v0.4.1",
                  "Not the explicitly authorized v0.4.1 release commit")
          require(gh_json("branches/main")["commit"]["sha"] == sha,
                  "main moved; do not tag an obsolete release commit")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          require(project["version"] == "0.4.1" and project["name"] == "danbooru-tag-jp-assist",
                  "Package identity/version does not match v0.4.1")
          require(Path("docs/RELEASE_v0.4.1.md").is_file(), "Release notes missing")

          # Disallow overwrite, retagging, or duplicate release even if rerun.
          for endpoint in ("git/ref/tags/v0.4.1", "releases/tags/v0.4.1"):
              result = subprocess.run(["gh", "api", f"repos/{repo}/{endpoint}"],
                                      capture_output=True, text=True)
              require(result.returncode != 0 and "HTTP 404" in result.stderr,
                      f"Existing tag/release or API error: {endpoint}")

          # Do not start a new Release when the target Registry version is
          # already reserved. A 404 means only 'not yet in Registry'.
          url = "https://api.comfy.org/nodes/danbooru-tag-jp-assist/versions/0.4.1"
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={"Accept":"application/json"}), timeout=30):
                  raise RuntimeError("Registry 0.4.1 already exists: no republish")
          except urllib.error.HTTPError as error:
              require(error.code == 404, f"Cannot verify Registry version availability: HTTP {error.code}")

          required = {"Product regression tests", "Registry publication configuration checks"}
          for attempt in range(45):
              runs = gh_json(f"actions/runs?head_sha={sha}&per_page=100")["workflow_runs"]
              matching = {}
              for run in runs:
                  if (run["head_sha"] == sha and run["event"] == "push"
                      and run.get("head_repository", {}).get("full_name") == repo
                      and run["name"] in required):
                      matching.setdefault(run["name"], run)
              failed = [name for name, run in matching.items()
                        if run["status"] == "completed" and run["conclusion"] != "success"]
              require(not failed, f"Required source CI failed: {failed}")
              passed = {name for name, run in matching.items()
                        if run["status"] == "completed" and run["conclusion"] == "success"}
              if passed == required:
                  print("Required CI passed for exact source:", sha)
                  break
              time.sleep(5)
          else:
              raise RuntimeError(f"Timed out waiting for required source CI: {sorted(required - passed)}")
          PY
      - name: Create tag and GitHub Release, then dispatch existing Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" > "$RUNNER_TEMP/v0.4.1-tag.json"
          python -B .github/registry_release.py release-source \
            --policy .github/registry-policy.json --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Danbooru Tag JP Assist v0.4.1" \
            --notes-file docs/RELEASE_v0.4.1.md --latest
          gh workflow run publish_registry.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$RELEASE_TAG"
